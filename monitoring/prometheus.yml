global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  # Promethues self monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Churn Prediction
  - job_name: churn-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
