[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mle-f1-tech-challenge"
version = "0.1.0"
description = "Telecommunications Customer Churn Prediction Pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "torch>=2.0.0",
    "mlflow>=2.0.0",
    "jupyter>=1.0.0",
    "PyYAML>=6.0",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.5",
    "folium>=0.20.0",
    "statsmodels>=0.14.6",
    "optuna>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pandera>=0.17.0",
    "httpx>=0.24.0",
    "xgboost>=3.0.0",
    "prometheus-fastapi-instrumentator>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "playwright>=1.40.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --verbose"
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore:Features.*are constant:UserWarning:sklearn",
    "ignore:divide by zero encountered in divide:RuntimeWarning:sklearn",
    "ignore:vert.*deprecated:PendingDeprecationWarning:seaborn",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py39"
per-file-ignores = {"notebooks/*.ipynb" = ["F821", "E402", "F401", "F811"]}
