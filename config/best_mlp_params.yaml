data:
  raw_path: data/raw/Telco_customer_churn.xlsx
  target: Churn Value
  test_size: 0.3
  random_state: 42
  drop_cols:
  - Country
  - State
  - Lat Long
  - Churn Label
  - Churn Reason
  - Count
  meta_cols:
  - CLTV
  - CustomerID
features:
  engineering:
    drop_churn_score: false
    add_engagement_score: true
    add_tenure_group: true
    add_tenure_log: true
    add_contract_ordinal: true
    add_family_stability: true
    add_fiber_no_support: true
    add_support_gap_count: true
    add_payment_automatic_flag: true
    add_electronic_check_flag: true
    add_paperless_echeck_flag: true
    add_price_pressure_ratio: true
  geo:
    strategy: drop
preprocessing:
  scaler:
    type: standard
    params:
      with_mean: false
model:
  name: mlp
  params:
    output_dim: 1
    hidden_dim: 39
    activation: tanh
    dropout: 0.2
    lr: 0.0006148315502475753
    weight_decay: 0.0
    batch_size: 80
    max_epochs: 80
    patience: 16
    min_delta: 0.001
    threshold: 0.5
    val_size: 0.15
    random_state: 42
    verbose: false
    selector_k: 44
cv:
  type: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 42
  n_jobs: 1
  scoring:
    pr_auc: average_precision
    roc_auc: roc_auc
    recall: recall
    precision: precision
    f1_score: f1
tracking:
  experiment_name: evaluation-mlp
  tracking_uri: sqlite:///mlflow.db
tuning:
  primary_metric: pr_auc
  direction: maximize
  n_trials: 50
  timeout_seconds: 1800
  convergence_patience_trials: 50
  convergence_min_improvement: 0.005
  search_space:
    activation:
    - tanh
    hidden_dim:
      low: 32
      high: 64
      step: 1
    dropout:
      low: 0.0
      high: 0.3
      step: 0.1
    lr:
      low: 0.0003
      high: 0.001
      log: true
    weight_decay:
    - 0.0
    - 1.0e-06
    - 1.0e-05
    batch_size:
    - 64
    - 80
    - 96
    - 112
    - 128
    selector_k:
      low: 35
      high: 45
      step: 1
evaluation:
  threshold: 0.5
  activation_cost: 50.0
  retention_rate: 0.1
optuna_result:
  source_config: config\experiments\optuna_mlp.yaml
  primary_metric: pr_auc
  best_metrics:
    pr_auc_mean: 0.9402462594082005
    pr_auc_std: 0.011493624796052607
    roc_auc_mean: 0.9762727622056631
    roc_auc_std: 0.004699803212885846
    recall_mean: 0.9227633002837005
    recall_std: 0.03436742724736621
    precision_mean: 0.7833252138156388
    precision_std: 0.018170563119457386
    f1_score_mean: 0.8465809908464067
    f1_score_std: 0.004914673052914038
    fit_time_mean: 2.0597213745117187
    score_time_mean: 0.02528853416442871
  best_trial_number: 18
