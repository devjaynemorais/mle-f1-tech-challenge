data:
  raw_path: data/raw/Telco_customer_churn.xlsx
  target: Churn Value
  test_size: 0.3
  random_state: 42
  drop_cols:
  - Country
  - State
  - Lat Long
  - Churn Label
  - Churn Reason
  - Count
  meta_cols:
  - CLTV
  - CustomerID
features:
  engineering:
    drop_churn_score: true
    add_engagement_score: false
    add_tenure_group: false
    add_tenure_log: false
    add_contract_ordinal: false
    add_family_stability: false
    add_fiber_no_support: false
    add_support_gap_count: false
    add_payment_automatic_flag: false
    add_electronic_check_flag: false
    add_paperless_echeck_flag: false
    add_price_pressure_ratio: false
  geo:
    strategy: drop
preprocessing:
  scaler:
    type: standard
    params:
      with_mean: false
model:
  name: xgboost
  params:
    objective: binary:logistic
    eval_metric: logloss
    random_state: 42
    n_jobs: 1
    n_estimators: 250
    max_depth: 4
    learning_rate: 0.02028527332925117
    min_child_weight: 2
    subsample: 0.8
    colsample_bytree: 1.0
    gamma: 0.4
    reg_alpha: 0.2
    reg_lambda: 4.063683404878093
    scale_pos_weight: 2.7691131498470947
cv:
  type: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 42
  n_jobs: 1
  scoring:
    pr_auc: average_precision
    roc_auc: roc_auc
    recall: recall
    precision: precision
    f1_score: f1
tracking:
  experiment_name: evaluation-xgb
  tracking_uri: sqlite:///mlflow.db
tuning:
  primary_metric: pr_auc
  direction: maximize
  n_trials: 25
  timeout_seconds: 1800
  convergence_patience_trials: 50
  convergence_min_improvement: 0.005
  search_space:
    n_estimators:
    - 200
    - 250
    - 300
    max_depth:
      low: 3
      high: 5
      step: 1
    learning_rate:
      low: 0.01
      high: 0.03
      log: true
    min_child_weight:
      low: 1
      high: 3
      step: 1
    subsample:
      low: 0.5
      high: 1.0
      step: 0.1
    colsample_bytree:
      low: 0.5
      high: 1.0
      step: 0.1
    gamma:
      low: 0.0
      high: 0.6
      step: 0.2
    reg_alpha:
      low: 0.0
      high: 0.5
      step: 0.1
    reg_lambda:
      low: 2
      high: 10.0
      log: true
evaluation:
  threshold: 0.5
  activation_cost: 50.0
  retention_rate: 0.1
optuna_result:
  source_config: config\experiments\optuna_xgb.yaml
  primary_metric: pr_auc
  best_metrics:
    pr_auc_mean: 0.6929882948895928
    pr_auc_std: 0.018435162383338297
    roc_auc_mean: 0.862769236362454
    roc_auc_std: 0.010866421785361194
    recall_mean: 0.8149717761984148
    recall_std: 0.023773424789131425
    precision_mean: 0.5331816184774525
    precision_std: 0.023362936404136128
    f1_score_mean: 0.6445296865333019
    f1_score_std: 0.023625081221719652
    fit_time_mean: 0.17130861282348633
    score_time_mean: 0.021921682357788085
  best_trial_number: 17
