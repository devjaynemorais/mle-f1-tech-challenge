data:
  raw_path: data/raw/Telco_customer_churn.xlsx
  target: Churn Value
  test_size: 0.3
  random_state: 42
  drop_cols:
  - Country
  - State
  - Lat Long
  - Churn Label
  - Churn Reason
  - Count
  meta_cols:
  - CLTV
  - CustomerID
features:
  engineering:
    drop_churn_score: true
    add_engagement_score: false
    add_tenure_group: false
    add_tenure_log: false
    add_contract_ordinal: false
    add_family_stability: false
    add_fiber_no_support: false
    add_support_gap_count: false
    add_payment_automatic_flag: false
    add_electronic_check_flag: false
    add_paperless_echeck_flag: false
    add_price_pressure_ratio: false
  geo:
    strategy: drop
preprocessing:
  scaler:
    type: standard
    params:
      with_mean: false
model:
  name: xgboost
  params:
    objective: binary:logistic
    eval_metric: logloss
    random_state: 42
    n_jobs: 1
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.026027936905488092
    min_child_weight: 10
    subsample: 0.8
    colsample_bytree: 0.9
    gamma: 3.5
    reg_alpha: 3.5
    reg_lambda: 9.90949334900523
    scale_pos_weight: 2.7691131498470947
cv:
  type: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 42
  n_jobs: 1
  scoring:
    pr_auc: average_precision
    roc_auc: roc_auc
    recall: recall
    precision: precision
    f1_score: f1
tracking:
  experiment_name: evaluation-xgb
  tracking_uri: sqlite:///mlflow.db
tuning:
  primary_metric: pr_auc
  direction: maximize
  n_trials: 25
  timeout_seconds: 1800
  convergence_patience_trials: 50
  convergence_min_improvement: 0.005
  search_space:
    n_estimators:
      low: 100
      high: 500
      step: 50
    max_depth:
      low: 3
      high: 10
      step: 1
    learning_rate:
      low: 0.01
      high: 0.3
      log: true
    min_child_weight:
      low: 1
      high: 10
      step: 1
    subsample:
      low: 0.5
      high: 1.0
      step: 0.1
    colsample_bytree:
      low: 0.5
      high: 1.0
      step: 0.1
    gamma:
      low: 0.0
      high: 5.0
      step: 0.5
    reg_alpha:
      low: 0.0
      high: 5.0
      step: 0.5
    reg_lambda:
      low: 0.1
      high: 10.0
      log: true
evaluation:
  threshold: 0.5
  activation_cost: 50.0
  retention_rate: 0.1
optuna_result:
  source_config: config\experiments\optuna_xgb.yaml
  primary_metric: pr_auc
  best_metrics:
    pr_auc_mean: 0.6924783716200411
    pr_auc_std: 0.01583604625668198
    roc_auc_mean: 0.8624948325043386
    roc_auc_std: 0.010446470115101511
    recall_mean: 0.8019595800064344
    recall_std: 0.028983103178538448
    precision_mean: 0.5344769365982798
    precision_std: 0.021647304027247148
    f1_score_mean: 0.6412883575246655
    f1_score_std: 0.022746175274360663
    fit_time_mean: 0.21150426864624022
    score_time_mean: 0.0191925048828125
  best_trial_number: 13
