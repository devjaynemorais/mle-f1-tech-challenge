data:
  raw_path: data/raw/Telco_customer_churn.xlsx
  target: Churn Value
  test_size: 0.3
  random_state: 42
  drop_cols:
  - Country
  - State
  - Lat Long
  - Churn Label
  - Churn Reason
  - Count
  meta_cols:
  - CLTV
  - CustomerID
features:
  engineering:
    drop_churn_score: false
    add_engagement_score: true
    add_tenure_group: true
    add_tenure_log: true
    add_contract_ordinal: true
    add_family_stability: true
    add_fiber_no_support: true
    add_support_gap_count: true
    add_payment_automatic_flag: true
    add_electronic_check_flag: true
    add_paperless_echeck_flag: true
    add_price_pressure_ratio: true
  geo:
    strategy: drop
preprocessing:
  scaler:
    type: standard
    params:
      with_mean: false
model:
  name: mlp
  params:
    output_dim: 1
    hidden_dim: 47
    activation: tanh
    dropout: 0.3
    lr: 0.0003815280135767075
    weight_decay: 1.0e-06
    batch_size: 128
    max_epochs: 80
    patience: 16
    min_delta: 0.001
    threshold: 0.33
    val_size: 0.15
    random_state: 42
    verbose: false
    selector_k: 43
cv:
  type: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 42
  n_jobs: 1
  scoring:
    pr_auc: average_precision
    roc_auc: roc_auc
    recall: recall
    precision: precision
    f1_score: f1
tracking:
  experiment_name: evaluation-mlp
  tracking_uri: sqlite:///mlflow.db
tuning:
  primary_metric: pr_auc
  direction: maximize
  n_trials: 10
  timeout_seconds: 1800
  convergence_patience_trials: 50
  convergence_min_improvement: 0.005
  search_space:
    activation:
    - tanh
    hidden_dim:
      low: 32
      high: 64
      step: 1
    dropout:
      low: 0.0
      high: 0.3
      step: 0.1
    lr:
      low: 0.0003
      high: 0.001
      log: true
    weight_decay:
    - 0.0
    - 1.0e-06
    - 1.0e-05
    batch_size:
    - 64
    - 80
    - 96
    - 112
    - 128
    selector_k:
      low: 35
      high: 45
      step: 1
evaluation:
  threshold: 0.33
  activation_cost: 50.0
  retention_rate: 0.1
optuna_result:
  source_config: config\experiments\optuna_mlp.yaml
  primary_metric: pr_auc
  best_metrics:
    pr_auc_mean: 0.9401525383447954
    pr_auc_std: 0.012026883776694924
    roc_auc_mean: 0.9763063186516142
    roc_auc_std: 0.004986660391698972
    recall_mean: 0.9281126612266386
    recall_std: 0.029797088290773592
    precision_mean: 0.7815566182930492
    precision_std: 0.00815260361609786
    f1_score_mean: 0.848175567607556
    f1_score_std: 0.008013848217782473
    fit_time_mean: 2.4444657802581786
    score_time_mean: 0.027310800552368165
  best_trial_number: 2
threshold_optimization:
  source_config: config\best_mlp_params.yaml
  primary_metric: roi
