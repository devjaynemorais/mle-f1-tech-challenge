data:
  raw_path: data/raw/Telco_customer_churn.xlsx
  target: Churn Value
  test_size: 0.3
  random_state: 42
  drop_cols:
  - Country
  - State
  - Lat Long
  - Churn Label
  - Churn Reason
  - Count
  meta_cols:
  - CLTV
  - CustomerID
features:
  engineering:
    drop_churn_score: false
    add_engagement_score: true
    add_tenure_group: true
    add_tenure_log: true
    add_contract_ordinal: true
    add_family_stability: true
    add_fiber_no_support: true
    add_support_gap_count: true
    add_payment_automatic_flag: true
    add_electronic_check_flag: true
    add_paperless_echeck_flag: true
    add_price_pressure_ratio: true
  geo:
    strategy: drop
preprocessing:
  scaler:
    type: standard
    params:
      with_mean: false
model:
  name: logistic_regression
  params:
    C: 0.865470221554479
    max_iter: 1000
    class_weight: null
cv:
  type: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 42
  n_jobs: 1
  scoring:
    pr_auc: average_precision
    roc_auc: roc_auc
    recall: recall
    precision: precision
    f1_score: f1
tracking:
  experiment_name: evaluation-logistic
  tracking_uri: sqlite:///mlflow.db
tuning:
  primary_metric: pr_auc
  direction: maximize
  n_trials: 25
  timeout_seconds: 1800
  convergence_patience_trials: 50
  convergence_min_improvement: 0.005
  search_space:
    C:
      low: 0.01
      high: 10.0
      log: true
    class_weight:
    - balanced
    - null
evaluation:
  threshold: 0.5
  activation_cost: 50.0
  retention_rate: 0.1
optuna_result:
  source_config: config\experiments\optuna_reglog.yaml
  primary_metric: pr_auc
  best_metrics:
    pr_auc_mean: 0.9398219839015433
    pr_auc_std: 0.01094068324091484
    roc_auc_mean: 0.9760698420886079
    roc_auc_std: 0.004695874602198751
    recall_mean: 0.8417390541370535
    recall_std: 0.02046020134260871
    precision_mean: 0.8549303786372364
    precision_std: 0.01558689898148868
    f1_score_mean: 0.8481676457617926
    f1_score_std: 0.015401123253549615
    fit_time_mean: 0.04184169769287109
    score_time_mean: 0.021104145050048827
  best_trial_number: 15
