# YAML completo para experimento allfeat com Regressao Logistica.
# Mantem o mesmo schema de `base_exp.yaml`.

data:
  raw_path: data/raw/Telco_customer_churn.xlsx
  target: Churn Value
  test_size: 0.3
  random_state: 42
  drop_cols:
    - Country
    - State
    - Lat Long
    - Churn Label
    - Churn Reason
    - Count
  meta_cols:
    - CLTV
    - CustomerID

features:
  engineering:
    drop_churn_score: false
    add_engagement_score: true
    add_tenure_group: true
    add_tenure_log: true
    add_contract_ordinal: true
    add_family_stability: true
    add_fiber_no_support: true
    add_support_gap_count: true
    add_payment_automatic_flag: true
    add_electronic_check_flag: true
    add_paperless_echeck_flag: true
    add_price_pressure_ratio: true
  geo:
    strategy: drop

preprocessing:
  scaler:
    type: standard
    params:
      with_mean: false

model:
  name: logistic_regression
  params:
    C: 1.0
    max_iter: 1000
    class_weight: balanced

cv:
  type: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 42
  n_jobs: 1
  scoring:
    pr_auc: average_precision
    roc_auc: roc_auc
    recall: recall
    precision: precision
    f1_score: f1

tracking:
  experiment_name: churn-allfeat
  tracking_uri: sqlite:///mlflow.db

tuning:
  primary_metric: pr_auc
  direction: maximize
  n_trials: 25
  timeout_seconds: 1800
  convergence_patience_trials: 50
  convergence_min_improvement: 0.005
  search_space:
    logistic_regression:
      C:
        low: 0.01
        high: 10.0
        log: true
      class_weight:
        - balanced
        - null
    mlp:
      activation:
        - relu
        - tanh
      hidden_dim:
        low: 32
        high: 256
        step: 32
      dropout:
        low: 0.0
        high: 0.5
        step: 0.1
      lr:
        low: 0.0003
        high: 0.01
        log: true
      weight_decay:
        low: 0.0
        high: 0.001
        step: 0.0001
      batch_size:
        - 32
        - 64
        - 128
    xgboost:
      n_estimators:
        low: 100
        high: 500
        step: 50
      max_depth:
        low: 3
        high: 10
        step: 1
      learning_rate:
        low: 0.01
        high: 0.3
        log: true
      min_child_weight:
        low: 1
        high: 10
        step: 1
      subsample:
        low: 0.5
        high: 1.0
        step: 0.1
      colsample_bytree:
        low: 0.5
        high: 1.0
        step: 0.1
      gamma:
        low: 0.0
        high: 5.0
        step: 0.5
      reg_alpha:
        low: 0.0
        high: 5.0
        step: 0.5
      reg_lambda:
        low: 0.1
        high: 10.0
        log: true

evaluation:
  threshold: 0.5
  activation_cost: 50.0
  retention_rate: 0.1
