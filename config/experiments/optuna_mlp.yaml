# YAML completo para tuning Optuna com MLP.
# Parent run consolida o melhor resultado; child runs registram os trials.

data:
  raw_path: data/raw/Telco_customer_churn.xlsx
  target: Churn Value
  test_size: 0.3
  random_state: 42
  drop_cols:
    - Country
    - State
    - Lat Long
    - Churn Label
    - Churn Reason
    - Count
  meta_cols:
    - CLTV
    - CustomerID

features:
  engineering:
    drop_churn_score: false
    add_engagement_score: true
    add_tenure_group: true
    add_tenure_log: true
    add_contract_ordinal: true
    add_family_stability: true
    add_fiber_no_support: true
    add_support_gap_count: true
    add_payment_automatic_flag: true
    add_electronic_check_flag: true
    add_paperless_echeck_flag: true
    add_price_pressure_ratio: true
  geo:
    strategy: drop

preprocessing:
  scaler:
    type: standard
    params:
      with_mean: false

model:
  name: mlp
  params:
    output_dim: 1
    hidden_dim: 64
    activation: relu
    dropout: 0.0
    lr: 0.001
    weight_decay: 0.0
    batch_size: 32
    max_epochs: 80
    patience: 16
    min_delta: 0.001
    threshold: 0.5
    val_size: 0.15
    random_state: 42
    verbose: false

cv:
  type: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 42
  n_jobs: 1
  scoring:
    pr_auc: average_precision
    roc_auc: roc_auc
    recall: recall
    precision: precision
    f1_score: f1

tracking:
  experiment_name: optuna-mlp
  tracking_uri: sqlite:///mlflow.db

tuning:
  primary_metric: pr_auc
  direction: maximize
  n_trials: 50
  timeout_seconds: 1800
  convergence_patience_trials: 50
  convergence_min_improvement: 0.005
  search_space:
    activation:
      - tanh
    hidden_dim:
      low: 32
      high: 64
      step: 1
    dropout:
      low: 0.0
      high: 0.3
      step: 0.1
    lr:
      low: 0.0003
      high: 0.001
      log: true
    weight_decay:
      - 0.0
      - 0.000001
      - 0.00001
    batch_size:
      - 64
      - 80
      - 96
      - 112
      - 128
    selector_k:
      low: 35
      high: 45
      step: 1

evaluation:
  threshold: 0.5
  activation_cost: 50.0
  retention_rate: 0.1
