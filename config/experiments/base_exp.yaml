# YAML base completo para os módulos em `src/experimentation`.
#
# Este arquivo deve ser suficiente para parametrizar:
# - run_experiment.py      -> cross-validation + tracking agregado no MLflow
# - run_experiment_suite.py -> múltiplos YAMLs no mesmo `tracking.experiment_name`
# - run_optuna.py         -> tuning com Optuna + nested runs por trial
# - evaluate.py           -> treino no train + avaliação no holdout + SHAP + métricas econômicas
#
# Observações:
# - `prep_data.py` atualmente usa `pd.read_csv`, então `data.raw_path` deve apontar para CSV.
# - `data.meta_cols` precisa manter `CLTV` para `evaluate.py` e métricas econômicas.
# - `tuning.search_space` pode conter espaços para vários modelos; o `run_optuna.py`
#   seleciona automaticamente `tuning.search_space[model.name]`.

data:
  # Caminho do dataset bruto consumido por `prep_data.load_data`.
  raw_path: data/raw/Telco_customer_churn.xlsx

  # Nome da coluna alvo binária.
  target: Churn Value

  # Hiperparâmetros do split holdout usados por `prep_data.split_data`.
  test_size: 0.3
  random_state: 42

  # Colunas removidas antes do split.
  # Use aqui apenas colunas que nunca devem entrar no pipeline.
  drop_cols:
    - Country
    - State
    - Lat Long
    - Churn Label
    - Churn Reason
    - Count

  # Colunas de metadados preservadas fora de X.
  # `CLTV` é obrigatório para `evaluate.py` e `compute_campaign_economics`.
  meta_cols:
    - CLTV
    - CustomerID

features:
  engineering:
    # Todos os parâmetros abaixo são consumidos por `FeatureEngineerTransformer`.
    # Ative/desative conforme o cenário do experimento.
    drop_churn_score: true
    add_engagement_score: false
    add_tenure_group: false
    add_tenure_log: false
    add_contract_ordinal: false
    add_family_stability: false
    add_fiber_no_support: false
    add_support_gap_count: false
    add_payment_automatic_flag: false
    add_electronic_check_flag: false
    add_paperless_echeck_flag: false
    add_price_pressure_ratio: false

  geo:
    # Consumido por `GeoTransformer`.
    # Opções suportadas hoje:
    # - drop
    # - frequency
    # - target
    # - risk_band
    # - zip_region
    # - geo_cluster
    strategy: drop

preprocessing:
  scaler:
    # Consumido por `build_pipeline.get_scaler`.
    # Opções suportadas:
    # - standard
    # - minmax
    # - robust
    # - none
    type: standard
    params:
      with_mean: false

model:
  # Consumido por `build_pipeline.get_model`.
  # Opções suportadas hoje:
  # - dummy
  # - logistic_regression
  # - xgboost
  # - mlp
  name: logistic_regression

  # Parâmetros default do estimador atual.
  # `run_optuna.py` sobrescreve estes valores quando encontra melhores hiperparâmetros.
  params:
    C: 1.0
    max_iter: 1000
    class_weight: balanced

cv:
  # Consumido por `run_experiment.build_cv` e `run_optuna.py`.
  type: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 42
  n_jobs: 1

  # As chaves deste bloco definem os nomes das métricas registradas no MLflow.
  scoring:
    pr_auc: average_precision
    roc_auc: roc_auc
    recall: recall
    precision: precision
    f1_score: f1

tracking:
  # Consumido por todos os runners.
  # Em `run_experiment_suite.py`, YAMLs com o mesmo experiment_name entram no mesmo experimento.
  experiment_name: churn-experimentation
  tracking_uri: sqlite:///mlflow.db

tuning:
  # Consumido por `run_optuna.py` e `src/utils/optuna_search.py`.
  # `primary_metric` deve bater com uma chave existente em `cv.scoring`.
  primary_metric: pr_auc
  direction: maximize
  n_trials: 25
  timeout_seconds: 1800
  convergence_patience_trials: 50
  convergence_min_improvement: 0.005

  # Espaços de busca por modelo.
  # O `run_optuna.py` seleciona automaticamente `search_space[model.name]`.
  search_space:
    logistic_regression:
      C:
        low: 0.01
        high: 10.0
        log: true
      class_weight:
        - balanced
        - null

    mlp:
      activation:
        - relu
        - tanh
      hidden_dim:
        low: 32
        high: 256
        step: 32
      dropout:
        low: 0.0
        high: 0.5
        step: 0.1
      lr:
        low: 0.0003
        high: 0.01
        log: true
      weight_decay:
        low: 0.0
        high: 0.001
        step: 0.0001
      batch_size:
        - 32
        - 64
        - 128

    xgboost:
      n_estimators:
        low: 100
        high: 500
        step: 50
      max_depth:
        low: 3
        high: 10
        step: 1
      learning_rate:
        low: 0.01
        high: 0.3
        log: true
      min_child_weight:
        low: 1
        high: 10
        step: 1
      subsample:
        low: 0.5
        high: 1.0
        step: 0.1
      colsample_bytree:
        low: 0.5
        high: 1.0
        step: 0.1
      gamma:
        low: 0.0
        high: 5.0
        step: 0.5
      reg_alpha:
        low: 0.0
        high: 5.0
        step: 0.5
      reg_lambda:
        low: 0.1
        high: 10.0
        log: true

evaluation:
  # Consumido por `evaluate.py`.
  # `threshold` é usado para binarização das probabilidades e cálculo econômico.
  threshold: 0.5
  activation_cost: 50.0
  retention_rate: 0.1
